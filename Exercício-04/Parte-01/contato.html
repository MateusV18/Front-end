<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Contato</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">TechStore</a>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="contact-container">
      <h1>Entre em Contato</h1>
      <p>Tem dúvidas sobre nossos produtos ou deseja fazer um orçamento? Preencha o formulário abaixo ou utilize nossos canais de atendimento.</p>
      
      <form action="#" method="GET" onsubmit="event.preventDefault(); alert('Formulário visual enviado com sucesso! (Demonstração do Exercício 4)');">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem / Interesse no Produto</label>
          <textarea id="mensagem" name="mensagem" placeholder="Escreva sua dúvida ou produto de interesse..." required></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TechStore</p>
  </footer>
</body>
</html>

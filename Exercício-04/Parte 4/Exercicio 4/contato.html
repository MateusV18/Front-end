<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | TechStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="nav-container">
      <a href="index.html" class="logo">TechStore</a>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="contato-wrap">
      <h1 class="page-title page-title--contato">Fale Conosco</h1>
      <div class="info-loja">
        <p>Endereço: Av. Tecnologia, 1000 — Belo Horizonte/MG</p>
        <p>E-mail: contato@techstore.com.br</p>
        <p>Telefone: (31) 99999-0000</p>
      </div>
      <form class="form-contato" action="#">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>

        <button type="submit" class="btn">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TechStore. Todos os direitos reservados.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contato</title>
    </head>
    <body>
        <table width="100%" border="0" cellpadding="0" cellspacing="0">
            <tr>
                <td align="center">
                    <table border="0" cellpadding="10" cellspacing="0" width="500">
                        <tr>
                            <td align="center">
                                <h1>Formulário de Contato</h1>
                                <p>faça seu cadastro para receber novidades do mundo Pokémon</p>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <form class="formulário">
                                    <fieldset>
                                        <legend>Informação de Contato</legend>
                                        <table border="0" cellpadding="6" cellspacing="0" width="100%">
                                            <tr>
                                                <td align="right"><label for="nome">Nome Completo</label></td>
                                                <td><input type="text" placeholder="Digite seu nome completo" id="nome" name="nome" required></td>
                                            </tr>
                                            <tr>
                                                <td align="right"><label for="email">Email</label></td>
                                                <td><input type="email" placeholder="exemplo@email.com" id="email" name="email" required></td>
                                            </tr>
                                            <tr>
                                                <td align="right" valign="top"><label for="feedback">Deixe seu comentário ou sugestões</label></td>
                                                <td><textarea name="feedback" id="feedback" rows="5" cols="40" maxlength="200" placeholder="Escreva sua mensagem aqui (máximo 400 caracteres)..."></textarea></td>
                                            </tr>
                                            <tr>
                                                <td></td>
                                                <td><button type="submit">Enviar</button></td>
                                            </tr>
                                        </table>
                                    </fieldset>
                                </form>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contato</title>
    </head>
    <body>
        <form class="formulário">
            <h1>Formulário de Contato</h1>
            <p>faça seu cadastro para receber novidades do mundo Pokémon</p>
            <fieldset>
                <legend>Informação de Contato</legend>
                <section id="campo-nome">
                    <label for="nome">Nome Completo</label>
                    <input type="text" placeholder="Digite seu nome completo" id="nome" name="nome" required>
                </section>
                <section id="campo-email">
                    <label for="email">Email</label>
                    <input type="email" placeholder="exemplo@email.com" id="nome" name="email" required>
                </section>
                <section id="campo-feedback">
                    <label for="feedback">Deixe seu comentário ou sugestões</label>
                    <textarea name="feedback" id="feedback" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
                </section>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </body>
</html>
